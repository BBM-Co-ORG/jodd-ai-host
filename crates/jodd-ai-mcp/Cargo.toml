[package]
name = "jodd-ai-mcp"
version = "1.0.0"
edition = "2021"
description = "MCP server for jodd-ai-host: runs Claude Code and Codex on your own server"
license = "Apache-2.0"
repository = "https://github.com/BBM-Co-ORG/jodd-ai-host"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
nix = { version = "0.30", features = ["signal", "process", "fs"] }
base64 = "0.22"
rmcp = { version = "2.2", default-features = false, features = ["server", "transport-io"] }
libc = "0.2"

[dev-dependencies]
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-child-process"] }
